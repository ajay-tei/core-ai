server {
    listen 80;
    listen 6010;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API, SignalR hub, health, and A2A discovery to the backend
    location ~ ^/(api|hub|health|\.well-known)/ {
        proxy_pass         http://diva-api:6032;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow long-running SSE streams
        proxy_read_timeout 600s;
        proxy_buffering    off;
    }

    # Vite output filenames are content-hashed, so a new build always gets a new URL —
    # safe to cache aggressively and immutably.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html references the current asset hashes, so it must never be served stale — otherwise
    # a fresh deploy behind a cache/proxy layer can keep serving an old bundle indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
