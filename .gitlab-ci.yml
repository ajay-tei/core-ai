# ─────────────────────────────────────────────────────────────────────────────
# Diva AI Platform — CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# 6-stage pipeline (single Windows shell runner):
#   build → test → package → backup → deploy → verify
#
# All stages run on a Windows shell executor (pwsh) with tags: ai, aiengine.
# Requires .NET 10 SDK, Docker Desktop, and SSH client on the runner machine.
# Dev stages auto-trigger on push to main.
# Prod requires manual trigger on package:ssh + backup:prod; deploy + verify auto-chain.
#
# Both dev and prod run against an EXTERNAL SQL Server — docker-compose.tei.yml +
# docker-compose.sqlserver.yml (NOT docker-compose.enterprise.yml). Compose project
# name is always "core-ai" (-p core-ai) so the images built/loaded by the package
# stage (core-ai-diva-api / core-ai-diva-portal) are reused instead of rebuilt.
# See TEI/prod-release.md for the full prod runbook this pipeline mirrors.
#
# Two Docker images are built and deployed:
#   diva-api    → root Dockerfile   (ASP.NET Core 10 + Node 22 for MCP tools)
#   diva-portal → admin-portal/Dockerfile (React/Vite SPA served by nginx; base path
#                 baked in at build time — /beta/tei-ai for dev, /beta/tei-ai-prod for prod)
# ─────────────────────────────────────────────────────────────────────────────

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  GIT_CLONE_PATH: 'C:\ci\tei-ai'
  GIT_CLEAN_FLAGS: "-ffd"
  DEV_DEPLOY_PATH: 'C:\ai-app\tei-ai-dev'
  PROD_DEPLOY_PATH: 'C:\ai-app\tei-ai'
  # Fixed local image names — match the Compose-derived name for project "core-ai" so
  # `docker compose -p core-ai up -d` reuses the loaded image instead of rebuilding.
  CORE_AI_API_IMAGE: "core-ai-diva-api"
  CORE_AI_PORTAL_IMAGE: "core-ai-diva-portal"
  # Registry-qualified names — only used when CI_REGISTRY_IMAGE is available (dev extra).
  DIVA_API_IMAGE: "$CI_REGISTRY_IMAGE/diva-api"
  DIVA_PORTAL_IMAGE: "$CI_REGISTRY_IMAGE/diva-portal"
  DOCKER_HOST_PROD: "tcp://localhost:2375"
  NUGET_PACKAGES: '$CI_PROJECT_DIR\.nuget\packages'
  # Portal branding — edit directly here if white-labelling (no GitLab variable needed)
  VITE_APP_NAME: "TEI AI"
  VITE_APP_SLUG: "tei"
  # Reverse-proxy subpaths baked into the portal build (see TEI/prod-release.md)
  DEV_VITE_BASE_PATH: "/beta/tei-ai"
  PROD_VITE_BASE_PATH: "/beta/tei-ai-prod"

cache:
  key: nuget-${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/packages/
  policy: pull-push

stages:
  - build
  - test
  - package
  - backup
  - deploy
  - verify

# ── Shared job templates ───────────────────────────────────────────────────────

.base-job:
  tags: [ai, aiengine]
  before_script:
    - dotnet --version

.prod-ssh-setup:
  before_script:
    - |
      $sshDir = "$env:USERPROFILE\.ssh"
      New-Item -ItemType Directory -Path $sshDir -Force | Out-Null
      $knownHostsFile = Join-Path $sshDir 'known_hosts'
      if (-not (Select-String -Path $knownHostsFile -Pattern $env:PROD_SSH_HOST -Quiet -ErrorAction SilentlyContinue)) {
        Add-Content -Path $knownHostsFile -Value $env:PROD_SSH_KNOWN_HOSTS -Encoding UTF8
      }
      $localKey = "$sshDir\deploy_key"
      $keyContent = $env:PROD_SSH_KEY -replace "`r`n","`n" -replace "`r","`n"
      if (-not $keyContent.TrimEnd().EndsWith("`n")) { $keyContent = $keyContent.TrimEnd() + "`n" }
      [System.IO.File]::WriteAllText($localKey, $keyContent, [System.Text.UTF8Encoding]::new($false))
      icacls $localKey /inheritance:r /grant:r "$env:USERNAME`:(F)" 2>&1 | Out-Null
      Write-Host "SSH setup complete"

.only-main:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Stage: build ──────────────────────────────────────────────────────────────

build:
  stage: build
  extends: .base-job
  script:
    - dotnet restore Diva.slnx --packages $env:NUGET_PACKAGES
    - dotnet build Diva.slnx --no-restore -c Release
  # No artifacts: the Release output is ~640 MB (506 MB of it duplicated dependency
  # DLLs across each test project), which exceeds the instance artifact limit and failed
  # the job with HTTP 413 after a successful build. The test stage compiles from the
  # NuGet cache instead — see its dependencies: [] below.

# ── Stage: test ───────────────────────────────────────────────────────────────

test:
  stage: test
  extends: .base-job
  needs: [build]
  dependencies: []
  script:
    - dotnet restore Diva.slnx --packages $env:NUGET_PACKAGES
    - |
      dotnet test Diva.slnx --no-restore -c Release `
        --logger "junit;LogFilePath=$PWD/results.xml" `
        --filter "Category!=Integration&Category!=Flaky"
  artifacts:
    when: always
    reports:
      junit: results.xml

# ── Stage: package ────────────────────────────────────────────────────────────

package:registry:
  stage: package
  extends:
    - .base-job
    - .only-main
  needs: [test]
  script:
    - |
      Write-Host "=== Validating Docker daemon ==="
      docker info | Select-Object -First 5

      $apiImage    = $env:CORE_AI_API_IMAGE
      $portalImage = $env:CORE_AI_PORTAL_IMAGE
      $basePath    = $env:DEV_VITE_BASE_PATH
      Write-Host "API image:     $apiImage"
      Write-Host "Portal image:  $portalImage (base path: $basePath)"

      Write-Host "=== Building diva-api image ==="
      docker build `
        -t "${apiImage}:$env:CI_COMMIT_SHORT_SHA" `
        -t "${apiImage}:latest" `
        .

      Write-Host "=== Building diva-portal image ==="
      docker build `
        --build-arg "VITE_APP_NAME=$env:VITE_APP_NAME" `
        --build-arg "VITE_APP_SLUG=$env:VITE_APP_SLUG" `
        --build-arg "VITE_BASE_PATH=$basePath" `
        -t "${portalImage}:$env:CI_COMMIT_SHORT_SHA" `
        -t "${portalImage}:latest" `
        ./admin-portal

      Write-Host "=== Verifying portal base path ==="
      docker run --rm --entrypoint sh "${portalImage}:latest" `
        -c "grep -o '/beta/tei-ai[a-z-]*' /usr/share/nginx/html/index.html | sort -u"

      if ($env:CI_REGISTRY_IMAGE) {
        Write-Host "=== Also tagging + pushing to registry ==="
        $regApi    = $env:DIVA_API_IMAGE
        $regPortal = $env:DIVA_PORTAL_IMAGE
        docker tag "${apiImage}:latest"    "${regApi}:$env:CI_COMMIT_SHORT_SHA"
        docker tag "${apiImage}:latest"    "${regApi}:latest"
        docker tag "${portalImage}:latest" "${regPortal}:$env:CI_COMMIT_SHORT_SHA"
        docker tag "${portalImage}:latest" "${regPortal}:latest"
        docker login $env:CI_REGISTRY -u $env:CI_REGISTRY_USER -p $env:CI_REGISTRY_PASSWORD
        docker push "${regApi}:$env:CI_COMMIT_SHORT_SHA"
        docker push "${regApi}:latest"
        docker push "${regPortal}:$env:CI_COMMIT_SHORT_SHA"
        docker push "${regPortal}:latest"
      } else {
        Write-Warning "CI_REGISTRY_IMAGE not set — skipping registry push (local images ready for deploy:dev)"
      }
      Write-Host "=== Package (dev) complete ==="

# Manual: build for PROD (base path /beta/tei-ai-prod), ship via SSH, load on prod.
# Mirrors TEI/prod-release.md steps 1-5 (no GitLab Container Registry involved).
package:ssh:
  stage: package
  extends:
    - .base-job
    - .prod-ssh-setup
    - .only-main
  needs: [test]
  when: manual
  script:
    - |
      Write-Host "=== Validating Docker daemon ==="
      docker info | Select-Object -First 5

      $apiImage    = $env:CORE_AI_API_IMAGE
      $portalImage = $env:CORE_AI_PORTAL_IMAGE
      $basePath    = $env:PROD_VITE_BASE_PATH
      $sha         = $env:CI_COMMIT_SHORT_SHA
      Write-Host "API image:     $apiImage"
      Write-Host "Portal image:  $portalImage (base path: $basePath)"

      Write-Host "=== Building diva-api image (--no-cache) ==="
      docker build --no-cache `
        -t "${apiImage}:$sha" `
        -t "${apiImage}:latest" .

      Write-Host "=== Building diva-portal image (--no-cache) ==="
      docker build --no-cache `
        --build-arg "VITE_APP_NAME=$env:VITE_APP_NAME" `
        --build-arg "VITE_APP_SLUG=$env:VITE_APP_SLUG" `
        --build-arg "VITE_BASE_PATH=$basePath" `
        -t "${portalImage}:${sha}-prod" ./admin-portal

      Write-Host "=== Verifying portal base path ==="
      $detected = docker run --rm --entrypoint sh "${portalImage}:${sha}-prod" `
        -c "grep -o '/beta/tei-ai[a-z-]*' /usr/share/nginx/html/index.html | sort -u"
      Write-Host "Detected: $detected"
      if ($detected -ne $basePath) {
        Write-Error "Portal base path mismatch — expected '$basePath', got '$detected'"
        exit 1
      }

      Write-Host "=== Saving images to tars ==="
      docker save "${apiImage}:$sha" "${apiImage}:latest" -o diva-api.tar
      docker save "${portalImage}:${sha}-prod"              -o diva-portal.tar
      $apiSize    = [math]::Round((Get-Item diva-api.tar).Length    / 1MB, 1)
      $portalSize = [math]::Round((Get-Item diva-portal.tar).Length / 1MB, 1)
      Write-Host "diva-api.tar:    ${apiSize} MB"
      Write-Host "diva-portal.tar: ${portalSize} MB"

      Write-Host "=== Transferring to prod ==="
      $keyFile = "$env:USERPROFILE\.ssh\deploy_key"
      $target  = "$env:PROD_SSH_USER@$env:PROD_SSH_HOST"
      scp -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes `
        diva-api.tar diva-portal.tar "${target}:$env:PROD_DEPLOY_PATH\"

      Write-Host "=== Loading images on prod + retagging portal to :latest ==="
      ssh -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes $target `
        "powershell -NoProfile -Command docker -H $env:DOCKER_HOST_PROD load -i $env:PROD_DEPLOY_PATH\diva-api.tar"
      ssh -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes $target `
        "powershell -NoProfile -Command docker -H $env:DOCKER_HOST_PROD load -i $env:PROD_DEPLOY_PATH\diva-portal.tar"
      ssh -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes $target `
        "powershell -NoProfile -Command docker -H $env:DOCKER_HOST_PROD tag ${portalImage}:${sha}-prod ${portalImage}:latest"

      Remove-Item diva-api.tar, diva-portal.tar -Force -ErrorAction SilentlyContinue
      Write-Host "=== Package (SSH → prod) complete ==="

# ── Stage: backup ─────────────────────────────────────────────────────────────

backup:dev:
  stage: backup
  extends:
    - .base-job
    - .only-main
  needs: [package:registry]
  script:
    - |
      pwsh -File scripts/backup-dev.ps1 `
        -DeployPath $env:DEV_DEPLOY_PATH `
        -CommitSha  $env:CI_COMMIT_SHORT_SHA

backup:prod:
  stage: backup
  extends:
    - .base-job
    - .prod-ssh-setup
    - .only-main
  needs: [package:ssh]
  when: manual
  script:
    - |
      pwsh -File scripts/backup-prod.ps1 `
        -SshKeyFile  "$env:USERPROFILE\.ssh\deploy_key" `
        -SshTarget   "$env:PROD_SSH_USER@$env:PROD_SSH_HOST" `
        -DeployPath  $env:PROD_DEPLOY_PATH `
        -CommitSha   $env:CI_COMMIT_SHORT_SHA

# ── Stage: deploy ─────────────────────────────────────────────────────────────

deploy:dev:
  stage: deploy
  extends:
    - .base-job
    - .only-main
  needs: [backup:dev]
  script:
    - |
      $devPath = $env:DEV_DEPLOY_PATH
      Write-Host "=== Ensuring dev deploy directory: $devPath ==="
      if (-not (Test-Path $devPath)) { $null = New-Item -ItemType Directory -Path $devPath -Force }

      Write-Host "=== Writing .env (SQL Server) ==="
      $envLines = @(
        "LLM__DirectProvider__Provider=Anthropic",
        "LLM__DirectProvider__ApiKey=$env:DEV_LLM_DIRECT_API_KEY",
        "LLM__DirectProvider__Model=claude-sonnet-4-6",
        "ANTHROPIC_API_KEY=$env:DEV_LLM_DIRECT_API_KEY",
        "SQL_SERVER_HOST=$env:DEV_SQL_SERVER_HOST",
        "SQL_DB_NAME=$env:DEV_SQL_DB_NAME",
        "SQL_TRACE_DB_NAME=$env:DEV_SQL_TRACE_DB_NAME",
        "SQL_USER=$env:DEV_SQL_USER",
        "SQL_PASSWORD=$env:DEV_SQL_PASSWORD",
        "Credentials__MasterKey=$env:DEV_CREDENTIALS_MASTER_KEY",
        "LocalAuth__SigningKey=$env:DEV_LOCAL_AUTH_SIGNING_KEY",
        "SCHEDULER_FEEDBACK_TOKEN_SECRET=$env:DEV_SCHEDULER_FEEDBACK_TOKEN_SECRET",
        "TaskScheduler__AutoPollEnabled=false",
        "OAuth__Enabled=true",
        "AdminPortal__CorsOrigin=$env:DEV_PORTAL_ORIGIN",
        "AppBranding__ProductName=$env:VITE_APP_NAME",
        "AppBranding__Slug=$env:VITE_APP_SLUG",
        "AppBranding__ApiAudience=$($env:VITE_APP_SLUG)-api",
        "AppBranding__LocalIssuer=$($env:VITE_APP_SLUG)-local",
        "Agent__LlmStreamIdleTimeoutSeconds=300",
        "Agent__LlmTimeoutSeconds=300",
        "Smtp__Host=$env:DEV_SMTP_HOST",
        "Smtp__Port=587",
        "Smtp__UseSsl=false",
        "Smtp__Username=$env:DEV_SMTP_USERNAME",
        "Smtp__Password=$env:DEV_SMTP_PASSWORD",
        "Smtp__DefaultFromAddress=$env:DEV_SMTP_FROMEMAIL",
        "Smtp__DefaultFromName=TEI AI"
      )
      $envContent = ($envLines -join "`n") + "`n"
      [System.IO.File]::WriteAllText("$devPath\.env", $envContent, [System.Text.UTF8Encoding]::new($false))

      Write-Host "=== Copying compose files (tei + sqlserver overlay) ==="
      Copy-Item "$env:CI_PROJECT_DIR\docker-compose.tei.yml" -Destination $devPath -Force
      Copy-Item "$env:CI_PROJECT_DIR\docker-compose.sqlserver.yml" -Destination $devPath -Force

      Write-Host "=== Deploying dev stack (images already built by package:registry) ==="
      Push-Location $devPath
      try {
        docker compose -p core-ai -f docker-compose.tei.yml -f docker-compose.sqlserver.yml up -d --remove-orphans
      } finally {
        Pop-Location
      }
      Write-Host "=== Deploy:dev complete ==="
  after_script:
    - |
      if ($env:CI_JOB_STATUS -eq "failed") {
        Write-Warning "Deploy:dev failed — initiating rollback"
        pwsh -File scripts/rollback.ps1 -Target dev -DeployPath $env:DEV_DEPLOY_PATH
      }

deploy:prod:
  stage: deploy
  extends:
    - .base-job
    - .prod-ssh-setup
    - .only-main
  needs:
    - backup:prod
    - package:ssh
  allow_failure: false
  script:
    - |
      $keyFile    = "$env:USERPROFILE\.ssh\deploy_key"
      $target     = "$env:PROD_SSH_USER@$env:PROD_SSH_HOST"
      $deployPath = $env:PROD_DEPLOY_PATH

      Write-Host "=== Writing .env (SQL Server) ==="
      $envLines = @(
        "LLM__DirectProvider__Provider=Anthropic",
        "LLM__DirectProvider__ApiKey=$env:PROD_LLM_DIRECT_API_KEY",
        "LLM__DirectProvider__Model=claude-sonnet-4-6",
        "ANTHROPIC_API_KEY=$env:PROD_LLM_DIRECT_API_KEY",
        "SQL_SERVER_HOST=$env:PROD_SQL_SERVER_HOST",
        "SQL_DB_NAME=$env:PROD_SQL_DB_NAME",
        "SQL_TRACE_DB_NAME=$env:PROD_SQL_TRACE_DB_NAME",
        "SQL_USER=$env:PROD_SQL_USER",
        "SQL_PASSWORD=$env:PROD_SQL_PASSWORD",
        "Credentials__MasterKey=$env:PROD_CREDENTIALS_MASTER_KEY",
        "LocalAuth__SigningKey=$env:PROD_LOCAL_AUTH_SIGNING_KEY",
        "SCHEDULER_FEEDBACK_TOKEN_SECRET=$env:PROD_SCHEDULER_FEEDBACK_TOKEN_SECRET",
        "TaskScheduler__AutoPollEnabled=true",
        "OAuth__Enabled=true",
        "AdminPortal__CorsOrigin=$env:PROD_PORTAL_ORIGIN",
        "AppBranding__ProductName=$env:VITE_APP_NAME",
        "AppBranding__Slug=$env:VITE_APP_SLUG",
        "AppBranding__ApiAudience=$($env:VITE_APP_SLUG)-api",
        "AppBranding__LocalIssuer=$($env:VITE_APP_SLUG)-local",
        "Agent__LlmStreamIdleTimeoutSeconds=300",
        "Agent__LlmTimeoutSeconds=300",
        "Smtp__Host=$env:PROD_SMTP_HOST",
        "Smtp__Port=587",
        "Smtp__UseSsl=false",
        "Smtp__Username=$env:PROD_SMTP_USERNAME",
        "Smtp__Password=$env:PROD_SMTP_PASSWORD",
        "Smtp__DefaultFromAddress=$env:PROD_SMTP_FROMEMAIL",
        "Smtp__DefaultFromName=TEI AI"
      )
      $envContent = ($envLines -join "`n") + "`n"
      $tmpEnvFile = Join-Path $env:TEMP ".env.prod.$env:CI_PIPELINE_ID"
      [System.IO.File]::WriteAllText($tmpEnvFile, $envContent, [System.Text.UTF8Encoding]::new($false))

      Write-Host "=== Copying files to prod ==="
      scp -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes `
        $tmpEnvFile "${target}:${deployPath}\.env"
      Remove-Item $tmpEnvFile -Force

      scp -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes `
        "$env:CI_PROJECT_DIR\docker-compose.tei.yml" "${target}:${deployPath}\"
      scp -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes `
        "$env:CI_PROJECT_DIR\docker-compose.sqlserver.yml" "${target}:${deployPath}\"

      Write-Host "=== Deploying on prod (images already loaded by package:ssh) ==="
      # -p core-ai matches the Compose project name the package:ssh images were tagged
      # under, so this reuses the loaded images instead of rebuilding (no source on prod).
      ssh -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes $target `
        "powershell -NoProfile -Command Set-Location '$deployPath'; docker -H $env:DOCKER_HOST_PROD compose -p core-ai -f docker-compose.tei.yml -f docker-compose.sqlserver.yml up -d --remove-orphans"
      Write-Host "=== Deploy:prod complete ==="
  after_script:
    - |
      if ($env:CI_JOB_STATUS -eq "failed") {
        Write-Warning "Deploy:prod failed — initiating rollback"
        pwsh -File scripts/rollback.ps1 -Target prod `
          -SshKeyFile "$env:USERPROFILE\.ssh\deploy_key" `
          -SshTarget  "$env:PROD_SSH_USER@$env:PROD_SSH_HOST" `
          -DeployPath $env:PROD_DEPLOY_PATH `
          -DockerHost $env:DOCKER_HOST_PROD
      }

# Manual, one-time SQLite -> SQL Server data copy — see TEI/prod-release.md step 5.
# Only needed the first time prod moves to a fresh/unprovisioned SQL Server database.
migrate:prod:
  stage: deploy
  extends:
    - .base-job
    - .prod-ssh-setup
    - .only-main
  when: manual
  allow_failure: true
  script:
    - |
      Write-Host "=== One-time SQLite -> SQL Server data migration (prod) ==="
      $keyFile    = "$env:USERPROFILE\.ssh\deploy_key"
      $target     = "$env:PROD_SSH_USER@$env:PROD_SSH_HOST"
      $deployPath = $env:PROD_DEPLOY_PATH
      scp -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes `
        "$env:CI_PROJECT_DIR\docker-compose.tei.yml" "${target}:${deployPath}\"
      scp -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes `
        "$env:CI_PROJECT_DIR\docker-compose.sqlserver.yml" "${target}:${deployPath}\"
      ssh -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes $target `
        "powershell -NoProfile -Command Set-Location '$deployPath'; docker -H $env:DOCKER_HOST_PROD compose -p core-ai -f docker-compose.tei.yml -f docker-compose.sqlserver.yml --profile migrate run --rm dbmigrate"
      Write-Host "=== Migration complete ==="

# ── Stage: verify ─────────────────────────────────────────────────────────────

verify:dev:
  stage: verify
  extends:
    - .base-job
    - .only-main
  needs: [deploy:dev]
  script:
    - |
      Write-Host "=== Health check (dev) ==="
      $maxRetries = 5
      $delay      = 15
      for ($i = 1; $i -le $maxRetries; $i++) {
        try {
          $response = Invoke-RestMethod -Uri "http://localhost:6032/health/live" -TimeoutSec 5
          $status = if ($response.status) { $response.status } else { $response }
          if ($status -notin @('ok', 'healthy', 'Healthy')) { throw "Unexpected status: $status" }
          Write-Host "Health check passed: $status (attempt $i)"
          exit 0
        } catch {
          Write-Host "Attempt $i/$maxRetries failed: $_"
          if ($i -lt $maxRetries) { Start-Sleep -Seconds $delay }
        }
      }
      Write-Error "Health check failed after $maxRetries attempts"
      exit 1

verify:prod:
  stage: verify
  extends:
    - .base-job
    - .prod-ssh-setup
    - .only-main
  needs: [deploy:prod]
  script:
    - |
      Write-Host "=== Health check (prod) ==="
      $keyFile     = "$env:USERPROFILE\.ssh\deploy_key"
      $target      = "$env:PROD_SSH_USER@$env:PROD_SSH_HOST"
      $maxRetries  = 5
      $delay       = 15
      $healthCheckLines = @(
        '$maxRetries = 5; $delay = 15',
        'for ($i = 1; $i -le $maxRetries; $i++) {',
        '  try {',
        '    $r = Invoke-RestMethod -Uri "http://localhost:6032/health/live" -TimeoutSec 5',
        '    $s = if ($r.status) { $r.status } else { $r }',
        '    if ($s -notin @("ok","healthy","Healthy")) { throw "Unexpected: $s" }',
        '    Write-Host "Health OK: $s (attempt $i)"; exit 0',
        '  } catch {',
        '    Write-Host "Attempt $i/$maxRetries : $_"',
        '    if ($i -lt $maxRetries) { Start-Sleep -Seconds $delay }',
        '  }',
        '}',
        'Write-Error "Health check failed"; exit 1'
      )
      $healthCheck = $healthCheckLines -join "`n"
      $encoded = [Convert]::ToBase64String([System.Text.Encoding]::Unicode.GetBytes($healthCheck))
      ssh -i $keyFile -o BatchMode=yes -o StrictHostKeyChecking=yes $target `
        "powershell -NoProfile -EncodedCommand $encoded"
